modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId="bettercombattoggler"
version="${file.jarVersion}"
displayName="Better Combat Toggler"

logoFile= "../icon.png"
authors="MapleBurn"

description='''
Adds a simple keybind (default 'K') to toggle Better Combat on and off instantly without restarting the game.
Perfect for switching between combat styles or troubleshooting.
'''

[[mixins]]
config = "bettercombattoggler.mixins.json"

[[dependencies.bettercombattoggler]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.bettercombattoggler]]
modId = "bettercombat"
type = "required"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "BOTH"